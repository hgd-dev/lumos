name: Freeze NYC Heat experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run freeze:nyc
      - uses: actions/upload-artifact@v4
        with:
          name: nyc-heat-v0.7-frozen-experiment
          path: data/cities/nyc/frozen/nyc-heat-v0.7.json
