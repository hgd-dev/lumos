name: Deploy LUMOS to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Run automated tests
        run: npm test

      - name: Check release integrity
        run: npm run check:release

      - name: Build static site
        run: npm run build

      - name: Confirm deployment artifact
        shell: bash
        run: |
          for page in index about unified heat air soil water; do
            test -f "dist/${page}.html"
          done
          test -f dist/workspace-shell.html
          test -f dist/404.html
          test -f dist/.nojekyll
          test -f dist/service-worker.js
          echo "Multi-page static Pages artifact is ready."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
