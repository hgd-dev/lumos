  <style>
    :root { color-scheme: dark; }

    h1 { margin-top: 0; }
    p { color: #b7cbc5; line-height: 1.6; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 9px 13px;
      border: 1px solid #2b4843;
      border-radius: 10px;
      color: #bdfc6b;
      text-decoration: none;
      background: #122321;
    }
    a:first-child { color: #10220f; background: #bdfc6b; border-color: #bdfc6b; }
    a:focus-visible { outline: 3px solid #89ddff; outline-offset: 3px; }
